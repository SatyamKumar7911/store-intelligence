<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Intelligence Dashboard</title>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #121212; color: #fff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h3 { margin-top: 0; color: #9ca3af; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .value { font-size: 2.5rem; font-weight: bold; color: #60a5fa; }
        .danger { color: #f87171; }
        .alert { background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Apex Retail - Bangalore 02</h1>
            <div><span id="status" style="color: #4ade80;">● Live</span></div>
        </div>
        
        <div id="anomaly-alert" class="alert"></div>
        
        <div class="grid">
            <div class="card">
                <h3>Unique Visitors (Today)</h3>
                <div class="value" id="val-visitors">0</div>
            </div>
            <div class="card">
                <h3>Conversion Rate</h3>
                <div class="value" id="val-conversion">0%</div>
            </div>
            <div class="card">
                <h3>Billing Queue Depth</h3>
                <div class="value" id="val-queue">0</div>
            </div>
            <div class="card">
                <h3>Abandonment Rate</h3>
                <div class="value" id="val-abandon">0%</div>
            </div>
        </div>
    </div>
    
    <script src="dashboard.js"></script>
</body>
</html>
